name: Pages

# This workflow and GitHub Pages are disabled until launch. Re-enabling them
# is a separate release decision. These triggers apply only once enabled.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a newer push does not cancel one in flight,
# because Pages deployments should finish once started.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Validate and package public files
        run: |
          python3 scripts/check-site.py
          tar --format=posix -cf "$RUNNER_TEMP/artifact.tar" \
            index.html style.css images privacy terms support CNAME robots.txt

      # Use upload-artifact directly: upload-pages-artifact's composite action
      # uses a mutable nested action reference. Only public site files are packed.
      - name: Upload the site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
