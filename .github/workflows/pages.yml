name: Pages

# Publishes this repo to GitHub Pages at https://cubip.com. Runs on
# Linux, so it costs nothing worth counting; it deploys on every push to main
# and on demand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a newer push does not cancel one in flight,
# because Pages deployments should finish once started.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
