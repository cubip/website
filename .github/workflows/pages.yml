name: Pages

# This workflow and GitHub Pages are disabled until launch. Re-enabling them
# is a separate release decision. These triggers apply only once enabled.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a newer push does not cancel one in flight,
# because Pages deployments should finish once started.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Validate and package public files
        run: |
          python3 scripts/check-site.py
          tar --format=posix -cf "$RUNNER_TEMP/artifact.tar" \
            index.html style.css images fonts imprint privacy terms support CNAME robots.txt

      # Use upload-artifact directly: upload-pages-artifact's composite action
      # uses a mutable nested action reference. Only public site files are packed.
      - name: Upload the site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
